name: Build Single EXE

on:
  workflow_dispatch: # يتيح لك التشغيل اليدوي بضغطة زر

permissions:
  contents: write # يمنع خطأ الصلاحيات الذي ظهر لك سابقاً

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Requirements
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller numpy matplotlib

    - name: Build Single EXE File
      run: |
        pyinstaller --noconfirm --onefile --windowed --name "Numerical6" numerical6.py

    - name: Upload EXE to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0
        name: "Sheet 6 - Euler Method"
        files: dist/Numerical6.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
